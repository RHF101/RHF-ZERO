<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>RHF ZERO Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080b10;
    color:#fff;
    font-family:"JetBrains Mono", monospace;
    padding:20px;
}

h1,h2{
    color:#c9a84c;
    margin-bottom:15px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    border:1px solid #2b2f36;
    background:#10151d;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

input,select,button{
    width:100%;
    padding:12px;
    background:#0d1117;
    color:#fff;
    border:1px solid #2b2f36;
    border-radius:8px;
    font-family:"JetBrains Mono", monospace;
}

button{
    cursor:pointer;
    background:#c9a84c;
    color:#000;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    overflow:auto;
}

th,td{
    border:1px solid #2b2f36;
    padding:12px;
    text-align:left;
    font-size:13px;
}

th{
    background:#121821;
    color:#c9a84c;
}

.status-active{
    color:#00ff88;
}

.status-dead{
    color:#ff4d4d;
}

.flex{
    display:flex;
    gap:10px;
}

.stat{
    padding:20px;
    border:1px solid #2b2f36;
    border-radius:12px;
    background:#0d1117;
}

.stat h3{
    color:#c9a84c;
    margin-bottom:10px;
}

.hidden{
    display:none;
}

@media(max-width:768px){
    table{
        font-size:12px;
    }

    th,td{
        padding:8px;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginBox">
        <h1>RHF ZERO ADMIN</h1>

        <div class="grid">
            <input type="password" id="adminPassword" autocomplete="off" />
            <button onclick="login()">LOGIN</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">

        <!-- STATS -->
        <div class="grid">
            <div class="stat">
                <h3>Total Codes</h3>
                <div id="totalCodes">0</div>
            </div>

            <div class="stat">
                <h3>Total Users</h3>
                <div id="totalUsers">0</div>
            </div>

            <div class="stat">
                <h3>Active Users</h3>
                <div id="activeUsers">0</div>
            </div>
        </div>

        <!-- CREATE CODE -->
        <div class="card">
            <h2>Create Access Code</h2>

            <div class="grid">
                <input type="text" id="codeInput" />

                <select id="typeInput">
                    <option value="trial">trial</option>
                    <option value="permanent">permanent</option>
                </select>

                <select id="durationInput">
                    <option value="3600">1 Hour</option>
                    <option value="86400">1 Day</option>
                    <option value="172800">2 Days</option>
                    <option value="604800">7 Days</option>
                </select>

                <button onclick="createCode()">CREATE</button>
            </div>
        </div>

        <!-- CHANGE PASSWORD -->
        <div class="card">
            <h2>Change Admin Password</h2>

            <div class="grid">
                <input type="password" id="newPassword" />
                <button onclick="changePassword()">UPDATE PASSWORD</button>
            </div>
        </div>

        <!-- CODES -->
        <div class="card">
            <h2>Access Codes</h2>

            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>User</th>
                        <th>Created</th>
                        <th>Expires</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="codesTable"></tbody>
            </table>
        </div>

        <!-- USERS -->
        <div class="card">
            <h2>Users</h2>

            <table>
                <thead>
                    <tr>
                        <th>UID</th>
                        <th>Email</th>
                        <th>Access Code</th>
                        <th>Blocked</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="usersTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
let adminPassword = "";

async function api(action, data = {}) {
    const res = await fetch("/api/admin", {
        method: "POST",
        headers: {
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            action,
            password: adminPassword,
            data
        })
    });

    return await res.json();
}

async function login() {
    const password = document.getElementById("adminPassword").value;

    adminPassword = password;

    const test = await api("listCodes");

    if (test.error) {
        alert("Login failed");
        return;
    }

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    loadAll();
}

async function loadAll() {
    await loadCodes();
    await loadUsers();
}

async function createCode() {
    const code = document.getElementById("codeInput").value.trim();
    const type = document.getElementById("typeInput").value;
    const duration = document.getElementById("durationInput").value;

    if (!code) {
        alert("Code required");
        return;
    }

    await api("createCode", {
        code,
        type,
        duration
    });

    document.getElementById("codeInput").value = "";

    loadCodes();
}

async function deleteCode(code) {
    const ok = confirm("Disable this code?");

    if (!ok) return;

    await api("deleteCode", { code });

    loadCodes();
}

async function loadCodes() {
    const codes = await api("listCodes");

    const table = document.getElementById("codesTable");

    table.innerHTML = "";

    document.getElementById("totalCodes").innerText = codes.length;

    let activeUsers = 0;

    codes.forEach(code => {

        if (code.used_by) {
            activeUsers++;
        }

        const active =
            code.active
            ? '<span class="status-active">ACTIVE</span>'
            : '<span class="status-dead">DISABLED</span>';

        const created = code.created_at
            ? new Date(code.created_at).toLocaleString()
            : "-";

        const expires = code.expires_at
            ? new Date(code.expires_at).toLocaleString()
            : "Never";

        table.innerHTML += `
            <tr>
                <td>${code.code}</td>
                <td>${code.type}</td>
                <td>${active}</td>
                <td>${code.used_by || "-"}</td>
                <td>${created}</td>
                <td>${expires}</td>
                <td>
                    <button onclick="deleteCode('${code.code}')">
                        DELETE
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("activeUsers").innerText = activeUsers;
}

async function loadUsers() {
    const users = await api("listUsers");

    const table = document.getElementById("usersTable");

    table.innerHTML = "";

    document.getElementById("totalUsers").innerText = users.length;

    users.forEach(user => {

        const blocked = user.blocked
            ? '<span class="status-dead">BLOCKED</span>'
            : '<span class="status-active">ACTIVE</span>';

        const action = user.blocked
            ? `<button onclick="unblockUser('${user.uid}')">UNBLOCK</button>`
            : `<button onclick="blockUser('${user.uid}')">BLOCK</button>`;

        table.innerHTML += `
            <tr>
                <td>${user.uid}</td>
                <td>${user.email || "-"}</td>
                <td>${user.accessCode || "-"}</td>
                <td>${blocked}</td>
                <td>${action}</td>
            </tr>
        `;
    });
}

async function blockUser(uid) {
    const ok = confirm("Block this user?");

    if (!ok) return;

    await api("blockUser", { uid });

    loadUsers();
}

async function unblockUser(uid) {
    const ok = confirm("Unblock this user?");

    if (!ok) return;

    await api("unblockUser", { uid });

    loadUsers();
}

async function changePassword() {
    const newPassword =
        document.getElementById("newPassword").value;

    if (!newPassword) {
        alert("Password required");
        return;
    }

    await api("changePassword", {
        newPassword
    });

    alert("Password updated");
}
</script>

</body>
</html>
