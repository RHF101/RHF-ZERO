<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHF ZERO Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#080b10;color:#d0dce8;font-family:monospace;padding:20px}
.card{background:#0d1117;border:1px solid #1e2d3d;border-radius:8px;padding:16px;margin-bottom:16px}
input,select,button{padding:8px 12px;margin:4px;background:#111820;border:1px solid #1e2d3d;color:#d0dce8;border-radius:4px}
button{background:#c9a84c;color:#000;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid #1e2d3d;text-align:left}
th{color:#c9a84c}
</style>
</head>
<body>

<div class="card" id="loginBox">
  <h2>Login Admin</h2>
  <input id="adminPass" type="password" placeholder="Password">
  <button onclick="login()">Masuk</button>
</div>

<div id="panel" style="display:none">
  <div class="card">
    <h2>Buat Kode</h2>
    <input id="newCode" placeholder="KODE" style="text-transform:uppercase">
    <select id="codeType"><option value="permanent">Permanen</option><option value="trial">Trial</option></select>
    <select id="codeDuration"><option value="3600">1 Jam</option><option value="86400">24 Jam</option><option value="172800">2 Hari</option></select>
    <button onclick="createCode()">Buat</button>
  </div>
  
  <div class="card">
    <h2>Kode Aktif</h2>
    <button onclick="loadCodes()">Refresh</button>
    <table id="codeTable"></table>
  </div>
  
  <div class="card">
    <h2>Users</h2>
    <table id="userTable"></table>
  </div>
</div>

<script>
let pass = '';

async function login() {
  pass = document.getElementById('adminPass').value;
  const res = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'listCodes',password:pass}) });
  const data = await res.json();
  if (Array.isArray(data)) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadCodes();
  } else {
    alert('Password salah');
  }
}

async function call(action, data={}) {
  const res = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action,password:pass,data}) });
  return res.json();
}

async function createCode() {
  const code = document.getElementById('newCode').value.trim();
  if (!code) return alert('Isi kode');
  const type = document.getElementById('codeType').value;
  const duration = parseInt(document.getElementById('codeDuration').value);
  await call('createCode', { code, type, duration });
  document.getElementById('newCode').value = '';
  loadCodes();
}

async function loadCodes() {
  const codes = await call('listCodes');
  const t = document.getElementById('codeTable');
  if (!Array.isArray(codes)) return;
  t.innerHTML = '<tr><th>Kode</th><th>Tipe</th><th>Status</th><th>Aksi</th></tr>';
  codes.forEach(c => {
    t.innerHTML += `<tr><td>${c.code}</td><td>${c.type}</td><td>${c.active?'✅':'❌'}</td>
    <td><button onclick="deleteCode('${c.code}')">Hapus</button></td></tr>`;
  });
}

async function deleteCode(code) {
  await call('deleteCode', { code });
  loadCodes();
}
</script>
</body>
</html>
