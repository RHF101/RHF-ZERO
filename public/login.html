<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHF ZERO — Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
      color: #fff;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #888; margin-bottom: 24px; }
    .btn-masuk {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c5ce7, #8b7cf0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-masuk:hover {
      background: linear-gradient(135deg, #7d6ff0, #9b8ff5);
      transform: translateY(-1px);
    }
    .btn-masuk:disabled {
      background: #1e1e2e;
      color: #555;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
    }
    .status.error { color: #ff6b6b; }
    .status.success { color: #00e676; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">⚡</div>
  <h1>RHF ZERO</h1>
  <p>Masuk otomatis tanpa daftar.<br>Data kamu tersimpan aman.</p>
  <button class="btn-masuk" id="btnLogin" onclick="masuk()">🚀 Masuk Sekarang</button>
  <div class="status" id="status"></div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDNFXLa8WGAqhLnc8RrLLTgP3nLWvXkd1w",
    authDomain: "rhf-confrims.firebaseapp.com",
    projectId: "rhf-confrims",
    storageBucket: "rhf-confrims.firebasestorage.app",
    messagingSenderId: "631231605918",
    appId: "1:631231605918:web:5a7eeeb61beeae91d65f8f"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const statusEl = document.getElementById('status');
  const btnLogin = document.getElementById('btnLogin');

  // ============================================================
  // CEK APAKAH SUDAH LOGIN
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      statusEl.textContent = '✅ Sudah masuk. Mengalihkan...';
      statusEl.className = 'status success';
      // Simpan UID ke localStorage
      localStorage.setItem('rhf_uid', user.uid);
      // Alihkan ke main app
      setTimeout(() => {
        window.location.href = '/';
      }, 800);
    }
  });

  // ============================================================
  // FUNGSI MASUK
  // ============================================================
  async function masuk() {
    btnLogin.disabled = true;
    btnLogin.textContent = 'Menghubungkan...';
    statusEl.textContent = '';
    statusEl.className = 'status';

    try {
      const result = await auth.signInAnonymously();
      statusEl.textContent = '✅ Berhasil! Mengalihkan...';
      statusEl.className = 'status success';
      localStorage.setItem('rhf_uid', result.user.uid);
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    } catch (error) {
      statusEl.textContent = '❌ Gagal: ' + error.message;
      statusEl.className = 'status error';
      btnLogin.disabled = false;
      btnLogin.textContent = '🚀 Coba Lagi';
    }
  }
</script>

</body>
</html>
