<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RHF ZERO</title>
  <link rel="icon" href="/icon-192.png"/>
  <link rel="apple-touch-icon" href="/icon-512.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#080b10"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #080b10; --bg2: #0d1117; --bg3: #111820;
      --border: #1e2d3d; --gold: #c9a84c; --gold2: #e8c96f;
      --blue: #1e90ff; --blue2: #4db8ff; --cyan: #00e5ff;
      --red: #ff3860; --green: #00e676; --text: #d0dce8;
      --muted: #5a7a96; --sidebar: 260px; --r: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── LAYAR KODE AKSES ── */
    #access-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      background: var(--bg);
      flex-direction: column;
      gap: 24px;
    }
    .access-logo {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: .25em;
      background: linear-gradient(135deg, var(--gold), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #access-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      font-size: 18px;
      text-align: center;
      letter-spacing: .2em;
      border-radius: var(--r);
      width: 200px;
      text-transform: uppercase;
    }
    .btn-access {
      padding: 12px 24px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: var(--r);
      font-weight: bold;
      cursor: pointer;
      letter-spacing: .1em;
    }
    #access-status { font-size: 12px; color: var(--red); min-height: 20px; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      background: var(--bg);
      flex-direction: column;
      gap: 32px;
    }
    .auth-logo {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: .25em;
      background: linear-gradient(135deg, var(--gold), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: var(--r);
      color: var(--gold2);
      letter-spacing: .12em;
      cursor: pointer;
      transition: all .25s;
    }
    .btn-google:hover { background: rgba(201,168,76,.08); }

    /* ── APP ── */
    #app { display: none; flex: 1; overflow: hidden; }
    #app.visible { display: flex; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar); background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-small { font-size: 16px; font-weight: 900; letter-spacing: .2em; color: var(--gold2); }
    .btn-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .user-chip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold); }
    .user-name { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-new-chat {
      margin: 12px; padding: 9px; background: rgba(201,168,76,.06);
      border: 1px solid rgba(201,168,76,.25); border-radius: var(--r);
      color: var(--gold2); cursor: pointer; text-align: center; letter-spacing: .08em;
      transition: all .2s;
    }
    .btn-new-chat:hover { background: rgba(201,168,76,.12); border-color: var(--gold); }

    /* ── SIDEBAR HISTORY ── */
    .sidebar-history { flex: 1; overflow-y: auto; padding: 4px 0; }
    .sidebar-history::-webkit-scrollbar { width: 4px; }
    .sidebar-history::-webkit-scrollbar-track { background: transparent; }
    .sidebar-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .hist-item {
      padding: 9px 14px 9px 16px;
      font-size: 11px; color: var(--muted); cursor: pointer;
      border-left: 2px solid transparent; transition: all .15s;
      display: flex; align-items: center; gap: 6px;
      position: relative;
    }
    .hist-item:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .hist-item.active { color: var(--gold2); border-left-color: var(--gold); background: rgba(201,168,76,.04); }
    .hist-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-item-del {
      opacity: 0; background: none; border: none; color: var(--red);
      cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px;
      transition: opacity .15s;
    }
    .hist-item:hover .hist-item-del { opacity: 1; }
    .hist-item-del:hover { background: rgba(255,56,96,.12); }

    .hist-section-label {
      padding: 10px 16px 4px;
      font-size: 9px; letter-spacing: .15em; color: var(--muted);
      text-transform: uppercase;
    }
    .hist-empty {
      padding: 20px; font-size: 11px; color: var(--muted); text-align: center;
    }
    .hist-loading {
      padding: 12px 16px; font-size: 10px; color: var(--muted); text-align: center;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── TOPBAR ── */
    #topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: rgba(13,17,23,.8);
      flex-shrink: 0;
    }
    .modes { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
    .mode-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: 11px; letter-spacing: .05em; white-space: nowrap;
    }
    .mode-btn.active { color: var(--gold2); background: rgba(201,168,76,.08); border-color: rgba(201,168,76,.3); }

    /* ── CHAT ── */
    #chat-area { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .msg { max-width: 820px; width: 100%; animation: fadeUp .25s ease; }
    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .msg-bubble { padding: 12px 16px; border-radius: var(--r); line-height: 1.7; word-break: break-word; }
    .msg.user .msg-bubble { background: rgba(201,168,76,.08); border: 1px solid rgba(201,168,76,.2); color: var(--gold2); max-width: 480px; }
    .msg.ai .msg-bubble { background: var(--bg3); border: 1px solid var(--border); }
    .msg-label { font-size: 10px; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
    .msg-actions { display: flex; gap: 6px; margin-top: 6px; }
    .act-btn {
      padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: 10px; letter-spacing: .06em;
    }
    .act-btn:hover { color: var(--text); border-color: var(--gold); }

    /* ── INPUT ── */
    #input-area { padding: 12px 16px 16px; border-top: 1px solid var(--border); background: rgba(13,17,23,.9); }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    #msg-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--r); padding: 11px 14px; color: var(--text);
      font-size: 13px; resize: none; min-height: 44px; max-height: 160px;
      outline: none; line-height: 1.5;
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--border);
      background: var(--bg3); color: var(--muted); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn { background: rgba(201,168,76,.1); border-color: rgba(201,168,76,.35); color: var(--gold2); }

    /* ── IMAGE PREVIEW ── */
    #img-preview-bar {
      display: none; padding: 6px 16px; background: rgba(201,168,76,.04);
      border-top: 1px solid rgba(201,168,76,.15); align-items: center; gap: 8px;
    }
    #img-preview-bar.visible { display: flex; }
    #img-preview-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold); }
    .img-preview-label { font-size: 10px; color: var(--muted); flex: 1; }
    .img-clear-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; }

    @media(max-width: 640px) {
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- ── LAYAR KODE AKSES ── -->
<div id="access-screen">
  <div class="access-logo">RHF ZERO</div>
  <input id="access-input" type="text" placeholder="KODE AKSES" autocomplete="off"/>
  <button class="btn-access" onclick="verifyAccess()">🔑 VERIFIKASI</button>
  <div id="access-status"></div>
</div>

<!-- ── LAYAR LOGIN ── -->
<div id="auth-screen">
  <div class="auth-logo">RHF ZERO</div>
  <button class="btn-google" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2a10.34 10.34 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92A8.78 8.78 0 0 0 17.64 9.2z"/><path fill="#34A853" d="M9 18a8.59 8.59 0 0 0 5.96-2.18l-2.92-2.26A5.43 5.43 0 0 1 9 14.5a5.44 5.44 0 0 1-5.11-3.76H.87v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.89 10.74A5.46 5.46 0 0 1 3.6 9c0-.6.1-1.18.29-1.74V4.93H.87A9 9 0 0 0 0 9c0 1.45.35 2.82.87 4.07l3.02-2.33z"/><path fill="#EA4335" d="M9 3.5a4.87 4.87 0 0 1 3.44 1.35l2.58-2.58A8.67 8.67 0 0 0 9 0 9 9 0 0 0 .87 4.93L3.89 7.26A5.44 5.44 0 0 1 9 3.5z"/></svg>

  </button>
</div>

<!-- ── APP ── -->
<div id="app">

    <div class="sidebar-header">

  <div id="main">
    <div id="topbar">
      <div class="modes">
        <button class="mode-btn active" data-mode="santai" onclick="setMode(this)">💬 SANTAI</button>
        <button class="mode-btn" data-mode="serius" onclick="setMode(this)">⚙️ SERIUS</button>
        <button class="mode-btn" data-mode="detektif" onclick="setMode(this)">🔍 DETEKTIF</button>
        <button class="mode-btn" data-mode="scraper" onclick="setMode(this)">🌐 SCRAPER</button>
        <button class="mode-btn" data-mode="3d" onclick="setMode(this)">🎲 3D</button>

<!-- ── APP LOGIC ── -->
<script>
// ── STATE ──
let currentUser = null, currentMode = 'santai', currentChatId = null;
let pendingImage = null, isLoading = false, lastFormat = 'txt';
let chatHistory = []; // cache list of chats

const UID = () => currentUser ? currentUser.uid : 'anon';

// ── KODE AKSES ──
if (localStorage.getItem('rhf_access_valid') === 'true') {
  document.getElementById('access-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

async function verifyAccess() {
  const code = document.getElementById('access-input').value.trim().toUpperCase();
  if (!code) return;
  document.getElementById('access-status').textContent = 'Memeriksa...';
  try {
    const res = await fetch('/api/access', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.valid) {
      localStorage.setItem('rhf_access_valid', 'true');
      localStorage.setItem('rhf_access_code', code);
      document.getElementById('access-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
    } else {
      document.getElementById('access-status').textContent = '❌ ' + (data.error || 'Kode tidak valid');
    }
  } catch(e) {
    document.getElementById('access-status').textContent = '❌ Gagal terhubung';
  }
}

// ── AUTH ──
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('user-avatar').src = user.photoURL || '';
    // Muat riwayat dari Firestore
    loadUserHistory();
    // Buat chat baru jika belum ada
    if (!currentChatId) chatBaru();
  } else {
    currentUser = null;
    document.getElementById('app').classList.remove('visible');
    if (localStorage.getItem('rhf_access_valid') === 'true') {
      document.getElementById('auth-screen').style.display = 'flex';
    }
  }
});

function signIn() { auth.signInWithPopup(provider); }
function signOut() { auth.signOut(); }

// ── MEMORY API ──
async function memoryCall(action, chatId, data) {
  const body = { action, uid: UID() };
  if (chatId) body.chatId = chatId;
  if (data) body.data = data;
  const res = await fetch('/api/memory', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}

// ── LOAD HISTORY (semua chat rooms user) ──
async function loadUserHistory() {
  const histEl = document.getElementById('sidebar-history');
  histEl.innerHTML = '<div class="hist-loading">⟳ Memuat...</div>';
  try {
    const result = await memoryCall('getChats');
    chatHistory = result.chats || [];
    renderSidebarHistory();
  } catch (e) {
    histEl.innerHTML = '<div class="hist-empty" style="color:var(--red)">❌ Gagal muat</div>';
  }
}

function renderSidebarHistory() {
  const histEl = document.getElementById('sidebar-history');
  if (!chatHistory || chatHistory.length === 0) {
    histEl.innerHTML = '<div class="hist-empty">Belum ada riwayat.</div>';
    return;
  }
  // Group by today / kemarin / lebih lama
  const now = Date.now();
  const oneDay = 86400000;
  const groups = { today: [], yesterday: [], older: [] };
  for (const chat of chatHistory) {
    const age = now - (chat.updatedAt || 0);
    if (age < oneDay) groups.today.push(chat);
    else if (age < oneDay * 2) groups.yesterday.push(chat);
    else groups.older.push(chat);
  }
  let html = '';
  if (groups.today.length) {
    html += '<div class="hist-section-label">Hari Ini</div>';
    html += groups.today.map(c => renderChatItem(c)).join('');
  }
  if (groups.yesterday.length) {
    html += '<div class="hist-section-label">Kemarin</div>';
    html += groups.yesterday.map(c => renderChatItem(c)).join('');
  }
  if (groups.older.length) {
    html += '<div class="hist-section-label">Sebelumnya</div>';
    html += groups.older.map(c => renderChatItem(c)).join('');
  }
  histEl.innerHTML = html;
  // Mark active
  updateActiveHistItem();
}

function renderChatItem(chat) {
  const title = (chat.title || 'Chat').substring(0, 32);
  const safeId = encodeURIComponent(chat._id);
  return `<div class="hist-item" id="hist-${chat._id}" onclick="bukaChat('${chat._id}')">
    <span class="hist-item-title" title="${title}">${title}</span>
    <button class="hist-item-del" onclick="hapusChat(event,'${chat._id}')" title="Hapus">✕</button>
  </div>`;
}

function updateActiveHistItem() {
  document.querySelectorAll('.hist-item').forEach(el => el.classList.remove('active'));
  if (currentChatId) {
    const el = document.getElementById('hist-' + currentChatId);
    if (el) el.classList.add('active');
  }
}

// ── BUKA CHAT (load messages dari Firestore) ──
async function bukaChat(chatId) {
  if (currentChatId === chatId) return;
  currentChatId = chatId;
  updateActiveHistItem();
  document.getElementById('chat-area').innerHTML = '<div style="padding:20px;text-align:center;font-size:11px;color:var(--muted)">⟳ Memuat pesan...</div>';
  try {
    const result = await memoryCall('getMessages', chatId);
    const messages = result.messages || [];
    document.getElementById('chat-area').innerHTML = '';
    if (messages.length === 0) {
      document.getElementById('chat-area').innerHTML = '<div style="padding:20px;text-align:center;font-size:11px;color:var(--muted)">Belum ada pesan.</div>';
    } else {
      for (const msg of messages) {
        renderMsg(msg.role || 'user', msg.content || '', msg.format || 'txt', false);
      }
      const area = document.getElementById('chat-area');
      area.scrollTop = area.scrollHeight;
    }
  } catch(e) {
    document.getElementById('chat-area').innerHTML = '<div style="padding:20px;text-align:center;font-size:11px;color:var(--red)">❌ Gagal memuat pesan</div>';
  }
}

// ── CHAT BARU ──
async function chatBaru() {
  const newId = 'chat_' + Date.now();
  currentChatId = newId;
  document.getElementById('chat-area').innerHTML = '';

  // Tambahkan ke sidebar dulu (optimistic)
  const newChat = { _id: newId, title: 'Chat Baru', updatedAt: Date.now(), mode: currentMode };
  chatHistory.unshift(newChat);
  renderSidebarHistory();

  // Buat di Firestore
  try {
    await memoryCall('createChat', newId, { title: 'Chat Baru', mode: currentMode });
  } catch(e) {
    console.warn('createChat error:', e);
  }
}

// ── HAPUS CHAT ──
async function hapusChat(event, chatId) {
  event.stopPropagation();
  if (!confirm('Hapus chat ini?')) return;

  // Hapus dari cache & sidebar
  chatHistory = chatHistory.filter(c => c._id !== chatId);
  renderSidebarHistory();

  // Jika chat yang dihapus sedang aktif, buat baru
  if (currentChatId === chatId) {
    currentChatId = null;
    document.getElementById('chat-area').innerHTML = '';
    await chatBaru();
  }

  // Hapus dari Firestore
  try {
    await memoryCall('deleteChat', chatId);
  } catch(e) {
    console.warn('deleteChat error:', e);
  }
}

// ── MODE ──
function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

// ── LEGACY newChat (dipetakan ke chatBaru) ──
function newChat() { chatBaru(); }

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ── SEND MESSAGE ──
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('msg-input');
  const message = input.value.trim();
  if (!message && !pendingImage) return;

  // Pastikan ada chatId aktif
  if (!currentChatId) {
    await chatBaru();
    await new Promise(r => setTimeout(r, 300));
  }

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  renderMsg('user', message || '[Gambar]', 'txt', true);
  input.value = '';
  const loadingId = renderTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message, mode: currentMode,
        image: pendingImage,
        uid: UID(),
        chatId: currentChatId,
        history: JSON.parse(localStorage.getItem('rhf_history_' + UID()) || '[]'),
        facts: JSON.parse(localStorage.getItem('rhf_facts_' + UID()) || '[]')
      })
    });
    const data = await res.json();
    removeTyping(loadingId);

    if (data.format) lastFormat = data.format;
    renderMsg('ai', data.response, data.format, true);

    // Update sidebar title pada chat pertama kali
    if (message) {
      const chatInList = chatHistory.find(c => c._id === currentChatId);
      if (chatInList && chatInList.title === 'Chat Baru') {
        chatInList.title = message.substring(0, 36);
        chatInList.updatedAt = Date.now();
        renderSidebarHistory();
      } else if (chatInList) {
        chatInList.updatedAt = Date.now();
        // Resort
        chatHistory.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        renderSidebarHistory();
      }
    }

    // Simpan memory lokal (localStorage fallback)
    if (data.simpan) {
      let h = JSON.parse(localStorage.getItem('rhf_history_' + UID()) || '[]');
      let f = JSON.parse(localStorage.getItem('rhf_facts_' + UID()) || '[]');
      h.push('👤: ' + data.simpan.userMsg, '🤖: ' + data.simpan.aiMsg);
      if (h.length > 300) h = h.slice(-300);
      if (data.simpan.isFakta) { f.push(message); if (f.length > 30) f = f.slice(-30); }
      localStorage.setItem('rhf_history_' + UID(), JSON.stringify(h));
      localStorage.setItem('rhf_facts_' + UID(), JSON.stringify(f));
    }

    clearImage();
  } catch(e) {
    removeTyping(loadingId);
    renderMsg('ai', '❌ Error: ' + e.message, 'txt', true);
  }
  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

// ── RENDER MESSAGE ──
function renderMsg(role, text, format, animate = true) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ' + role + (animate ? '' : ' no-anim');
  const label = role === 'user' ? 'KAMU' : 'RHF ZERO';
  let actions = '';
  if (role === 'ai' && text && format) {
    const safe = encodeURIComponent(text);
    actions = `<div class="msg-actions">
      <button class="act-btn" onclick="copyText('${safe}')">📋 SALIN</button>
      <button class="act-btn" onclick="downloadText('${safe}','${format}')">📥 ${format.toUpperCase()}</button>
    </div>`;
  }
  div.innerHTML = `<div class="msg-label">${label}</div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>${actions}`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function renderTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = '<div class="msg-label">RHF ZERO</div><div class="msg-bubble" style="color:var(--muted)">⟳ mengetik...</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return 'typing';
}

function removeTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

function copyText(encoded) {
  navigator.clipboard.writeText(decodeURIComponent(encoded));
}

function downloadText(encoded, format) {
  const text = decodeURIComponent(encoded);
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rhf-zero.' + format;
  a.click();
}

// ── IMAGE UPLOAD ──
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    document.getElementById('img-preview-thumb').src = reader.result;
    document.getElementById('img-preview-bar').classList.add('visible');
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  pendingImage = null;
  document.getElementById('img-preview-bar').classList.remove('visible');
  document.getElementById('img-upload').value = '';
}
</script>
