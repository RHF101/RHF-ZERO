<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RHF ZERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet"/>

<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
:root {
  --bg:       #080b10;
  --bg2:      #0d1117;
  --bg3:      #111820;
  --border:   #1e2d3d;
  --gold:     #c9a84c;
  --gold2:    #e8c96f;
  --blue:     #1e90ff;
  --blue2:    #4db8ff;
  --cyan:     #00e5ff;
  --red:      #ff3860;
  --green:    #00e676;
  --text:     #d0dce8;
  --muted:    #5a7a96;
  --sidebar:  260px;
  --r:        8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── SCANLINE overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.07) 2px,
    rgba(0,0,0,.07) 4px
  );
}

/* ── AUTH SCREEN ── */
#auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100dvh;
  gap: 32px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,168,76,.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(30,144,255,.08) 0%, transparent 60%),
    var(--bg);
}

.auth-logo {
  font-family: 'Orbitron', monospace;
  font-size: clamp(2.4rem, 6vw, 4rem);
  font-weight: 900;
  letter-spacing: .25em;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--blue2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 24px rgba(201,168,76,.4));
}

.auth-sub {
  color: var(--muted);
  letter-spacing: .3em;
  font-size: 11px;
  text-transform: uppercase;
}

.btn-google {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: var(--r);
  color: var(--gold2);
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: .12em;
  cursor: pointer;
  transition: all .25s;
  box-shadow: 0 0 20px rgba(201,168,76,.1);
}
.btn-google:hover {
  background: rgba(201,168,76,.08);
  box-shadow: 0 0 32px rgba(201,168,76,.25);
  transform: translateY(-1px);
}
.btn-google svg { flex-shrink: 0; }

/* ── APP SHELL ── */
#app { display: none; flex: 1; overflow: hidden; position: relative; }
#app.visible { display: flex; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform .3s;
}

.sidebar-header {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-small {
  font-family: 'Orbitron', monospace;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: .2em;
  background: linear-gradient(135deg, var(--gold), var(--blue2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}

.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  object-fit: cover;
  flex-shrink: 0;
}

.user-name {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.btn-logout {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color .2s;
}
.btn-logout:hover { color: var(--red); }

.btn-new-chat {
  margin: 12px;
  padding: 9px;
  background: rgba(201,168,76,.06);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: var(--r);
  color: var(--gold2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .08em;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}
.btn-new-chat:hover {
  background: rgba(201,168,76,.12);
  border-color: var(--gold);
}

.sidebar-history {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.sidebar-history::-webkit-scrollbar { width: 3px; }
.sidebar-history::-webkit-scrollbar-track { background: transparent; }
.sidebar-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.hist-item {
  padding: 9px 16px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
  transition: all .15s;
}
.hist-item:hover { color: var(--text); background: rgba(255,255,255,.03); }
.hist-item.active {
  color: var(--gold2);
  border-left-color: var(--gold);
  background: rgba(201,168,76,.04);
}

.hist-empty {
  padding: 20px 16px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  opacity: .6;
}

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 40% at 50% -10%, rgba(30,144,255,.05) 0%, transparent 60%),
    var(--bg);
}

/* ── TOPBAR ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,17,23,.8);
  backdrop-filter: blur(8px);
  flex-shrink: 0;
}

#btn-toggle-sidebar {
  display: none;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  padding: 2px 6px;
}

/* MODE TABS */
.modes {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.modes::-webkit-scrollbar { display: none; }

.mode-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .05em;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.mode-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
.mode-btn.active {
  color: var(--gold2);
  background: rgba(201,168,76,.08);
  border-color: rgba(201,168,76,.3);
}
.mode-btn.active.m-serius   { color: var(--blue2); background: rgba(30,144,255,.08); border-color: rgba(30,144,255,.3); }
.mode-btn.active.m-detektif { color: var(--cyan);  background: rgba(0,229,255,.07);  border-color: rgba(0,229,255,.3); }
.mode-btn.active.m-scraper  { color: var(--green); background: rgba(0,230,118,.07);  border-color: rgba(0,230,118,.3); }
.mode-btn.active.m-3d       { color: #c792ea;      background: rgba(199,146,234,.07);border-color: rgba(199,146,234,.3);}

/* ── CHAT AREA ── */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#chat-area::-webkit-scrollbar { width: 4px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 820px;
  width: 100%;
  animation: fadeUp .25s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; }
.msg.ai   { align-self: flex-start; }

.msg-bubble {
  padding: 12px 16px;
  border-radius: var(--r);
  line-height: 1.7;
  word-break: break-word;
}
.msg.user .msg-bubble {
  background: rgba(201,168,76,.08);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: var(--r) var(--r) 2px var(--r);
  color: var(--gold2);
  font-size: 13px;
  max-width: 480px;
}
.msg.ai .msg-bubble {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r) var(--r) var(--r) 2px;
  font-size: 13px;
}

.msg-label {
  font-size: 10px;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}
.msg.user .msg-label { text-align: right; }

/* Code blocks inside AI bubble */
.msg.ai .msg-bubble pre {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.5;
}
.msg.ai .msg-bubble code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: rgba(255,255,255,.06);
  border-radius: 3px;
  padding: 1px 5px;
}
.msg.ai .msg-bubble pre code {
  background: none;
  padding: 0;
}

/* Action buttons */
.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.act-btn {
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .06em;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.act-btn:hover { color: var(--text); border-color: var(--gold); background: rgba(201,168,76,.06); }
.act-btn.copied { color: var(--green); border-color: var(--green); }

/* Typing indicator */
.typing-indicator .msg-bubble {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 18px;
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: blink 1.2s ease infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%,80%,100% { opacity:.25; transform:scale(.8); }
  40%          { opacity:1;   transform:scale(1.1); }
}

/* Image preview */
.img-preview-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 8px;
}
.img-preview-wrap img {
  max-width: 220px;
  border-radius: 6px;
  border: 1px solid var(--border);
  display: block;
}
.img-preview-wrap .rm-img {
  position: absolute;
  top: -6px; right: -6px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--red);
  border: none;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* ── INPUT AREA ── */
#input-area {
  flex-shrink: 0;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  background: rgba(13,17,23,.9);
  backdrop-filter: blur(8px);
}

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#img-preview-area {
  margin-bottom: 8px;
}

#msg-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 11px 14px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  resize: none;
  min-height: 44px;
  max-height: 160px;
  outline: none;
  transition: border-color .2s;
  line-height: 1.5;
}
#msg-input::placeholder { color: var(--muted); }
#msg-input:focus { border-color: rgba(201,168,76,.4); }

.input-btns {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.icon-btn {
  width: 40px; height: 40px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); border-color: var(--gold); background: rgba(201,168,76,.06); }
.icon-btn.send-btn {
  background: rgba(201,168,76,.1);
  border-color: rgba(201,168,76,.35);
  color: var(--gold2);
}
.icon-btn.send-btn:hover {
  background: rgba(201,168,76,.2);
  box-shadow: 0 0 16px rgba(201,168,76,.2);
}
.icon-btn.send-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#img-upload { display: none; }

/* Hints */
.input-hint {
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: .05em;
}

/* ── STATUS BAR ── */
#status-bar {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .08em;
  padding: 0 16px 4px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  flex-shrink: 0;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--r);
  font-size: 12px;
  pointer-events: none;
  opacity: 0;
  transition: all .3s;
  z-index: 1000;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── RESPONSIVE ── */
@media(max-width: 640px) {
  #sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #btn-toggle-sidebar { display: flex; }
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 199;
  }
  #sidebar-overlay.show { display: block; }
}
</style>
</head>
<body>

<!-- ── AUTH SCREEN ── -->
<div id="auth-screen">
  <div class="auth-logo">RHF ZERO</div>
  <div class="auth-sub">Radit High-End Future · AI Terminal</div>
  <button class="btn-google" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2a10.34 10.34 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92A8.78 8.78 0 0 0 17.64 9.2z"/><path fill="#34A853" d="M9 18a8.59 8.59 0 0 0 5.96-2.18l-2.92-2.26A5.43 5.43 0 0 1 9 14.5a5.44 5.44 0 0 1-5.11-3.76H.87v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.89 10.74A5.46 5.46 0 0 1 3.6 9c0-.6.1-1.18.29-1.74V4.93H.87A9 9 0 0 0 0 9c0 1.45.35 2.82.87 4.07l3.02-2.33z"/><path fill="#EA4335" d="M9 3.5a4.87 4.87 0 0 1 3.44 1.35l2.58-2.58A8.67 8.67 0 0 0 9 0 9 9 0 0 0 .87 4.93L3.89 7.26A5.44 5.44 0 0 1 9 3.5z"/></svg>
    MASUK DENGAN GOOGLE
  </button>
</div>

<!-- ── APP ── -->
<div id="app">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <span class="logo-small">RHF·ZERO</span>
      <button class="btn-logout" onclick="signOut()" title="Logout">⏻</button>
    </div>
    <div class="user-chip">
      <img id="user-avatar" class="avatar" src="" alt=""/>
      <span id="user-name" class="user-name">—</span>
    </div>
    <button class="btn-new-chat" onclick="newChat()">＋ CHAT BARU</button>
    <div class="sidebar-history" id="sidebar-history">
      <div class="hist-empty">Belum ada riwayat.</div>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button id="btn-toggle-sidebar" onclick="toggleSidebar()">☰</button>
      <div class="modes" id="mode-tabs">
        <button class="mode-btn active m-santai"   data-mode="santai"   onclick="setMode(this)">💬 SANTAI</button>
        <button class="mode-btn m-serius"           data-mode="serius"   onclick="setMode(this)">⚙️ SERIUS</button>
        <button class="mode-btn m-detektif"         data-mode="detektif" onclick="setMode(this)">🔍 DETEKTIF</button>
        <button class="mode-btn m-scraper"          data-mode="scraper"  onclick="setMode(this)">🌐 SCRAPER</button>
        <button class="mode-btn m-3d"               data-mode="3d"       onclick="setMode(this)">🎲 3D</button>
      </div>
    </div>

    <div id="chat-area"></div>

    <div id="status-bar">
      <span class="status-dot"></span>
      <span id="status-text">SIAP</span>
      <span id="mode-indicator">MODE: SANTAI</span>
    </div>

    <div id="input-area">
      <div id="img-preview-area"></div>
      <div class="input-row">
        <textarea id="msg-input" placeholder="Ketik pesan..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <div class="input-btns">
          <button class="icon-btn" id="img-btn" onclick="document.getElementById('img-upload').click()" title="Upload gambar">📎</button>
          <button class="icon-btn send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
      <input type="file" id="img-upload" accept="image/*" onchange="handleImageUpload(event)"/>
      <div class="input-hint" id="input-hint">Enter kirim · Shift+Enter baris baru</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ── FIREBASE CONFIG ── -->
<script>
const firebaseConfig = {
  apiKey:            "AIzaSyDNFXLa8WGAqhLnc8RrLLTgP3nLWvXkd1w",
  authDomain:        "rhf-confrims.firebaseapp.com",
  projectId:         "rhf-confrims",
  storageBucket:     "rhf-confrims.firebasestorage.app",
  messagingSenderId: "631231605918",
  appId:             "1:631231605918:web:5a7eeeb61beeae91d65f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();
</script>
<!-- ── APP LOGIC ── -->
<script>
// ── STATE ──
let currentUser  = null;
let currentMode  = 'santai';
let currentChatId= null;
let pendingImage = null; // base64
let isLoading    = false;

// ── AUTH ──
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('user-name').textContent   = user.displayName || user.email;
    document.getElementById('user-avatar').src         = user.photoURL || '';
    if (!currentChatId) newChat();
    loadSidebarHistory();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').classList.remove('visible');
  }
});

function signIn()  { auth.signInWithPopup(provider).catch(e => toast('Login gagal: ' + e.message)); }
function signOut() { auth.signOut(); }

// ── SIDEBAR ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ── MODE ──
function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
  document.getElementById('mode-indicator').textContent = 'MODE: ' + currentMode.toUpperCase();

  // Show/hide image button
  const imgBtn = document.getElementById('img-btn');
  imgBtn.style.display = currentMode === 'detektif' ? 'flex' : 'none';
  if (currentMode !== 'detektif') { pendingImage = null; renderImgPreview(); }

  // Hint
  const hints = {
    santai:   'Obrolan natural singkat.',
    serius:   'Coding expert — output markdown.',
    detektif: 'Analisis gambar + teks.',
    scraper:  'Ekstrak/scrape dari URL atau deskripsi.',
    '3d':     'Buat kode Three.js / 3D scene.'
  };
  document.getElementById('input-hint').textContent = hints[currentMode] || 'Enter kirim · Shift+Enter baris baru';
}

// init hide img btn
document.getElementById('img-btn').style.display = 'none';

// ── CHAT ID ──
function newChat() {
  currentChatId = 'chat_' + Date.now();
  document.getElementById('chat-area').innerHTML = '';
  pendingImage = null;
  renderImgPreview();
  document.querySelectorAll('.hist-item').forEach(el => el.classList.remove('active'));
  closeSidebar();
}

// ── LOCALSTORAGE HELPERS ──
function lsKey(type) {
  if (!currentUser) return null;
  return `rhf_${type}_${currentUser.uid}`;
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(lsKey('history')) || '[]'); } catch { return []; }
}
function getFacts() {
  try { return JSON.parse(localStorage.getItem(lsKey('facts')) || '[]'); } catch { return []; }
}
function saveToLS(simpan) {
  if (!simpan || !currentUser) return;
  // History
  const hist = getHistory();
  if (simpan.userMsg) hist.push('user: ' + simpan.userMsg);
  if (simpan.aiMsg)   hist.push('ai: '   + simpan.aiMsg);
  while (hist.length > 100) hist.shift();
  localStorage.setItem(lsKey('history'), JSON.stringify(hist));
  // Facts
  if (simpan.isFakta && simpan.userMsg) {
    const facts = getFacts();
    facts.push(simpan.userMsg);
    while (facts.length > 40) facts.shift();
    localStorage.setItem(lsKey('facts'), JSON.stringify(facts));
  }
}

// ── IMAGE UPLOAD ──
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImage = ev.target.result; // full data URL
    renderImgPreview();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function renderImgPreview() {
  const area = document.getElementById('img-preview-area');
  if (!pendingImage) { area.innerHTML = ''; return; }
  area.innerHTML = `
    <div class="img-preview-wrap">
      <img src="${pendingImage}" alt="preview"/>
      <button class="rm-img" onclick="pendingImage=null;renderImgPreview()">×</button>
    </div>`;
}

// ── SEND MESSAGE ──
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('msg-input');
  const message = input.value.trim();
  if (!message && !pendingImage) return;

  input.value = '';
  autoResize(input);

  // Append user bubble
  appendMessage('user', message, pendingImage);

  const imgData = pendingImage;
  pendingImage = null;
  renderImgPreview();

  // Disable send
  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  setStatus('MEMPROSES...');

  // Typing indicator
  const typingId = appendTyping();

  try {
    const body = {
      message,
      mode:   currentMode,
      uid:    currentUser?.uid,
      chatId: currentChatId,
      history: getHistory(),
      facts:   getFacts()
    };
    if (imgData && currentMode === 'detektif') {
      body.image = imgData;
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    removeTyping(typingId);

    if (data.response) {
      appendMessage('ai', data.response, null, data.format);
      if (data.simpan) saveToLS(data.simpan);
      loadSidebarHistory();
    } else {
      appendMessage('ai', data.error || 'Terjadi kesalahan.', null, 'txt');
    }
  } catch (err) {
    removeTyping(typingId);
    appendMessage('ai', '⚠️ Gagal terhubung ke server.', null, 'txt');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  setStatus('SIAP');
}

// ── RENDER MESSAGES ──
function appendMessage(role, text, imgSrc, format) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const label = role === 'user' ? '— KAMU' : '— RHF ZERO';
  let content = '';

  if (imgSrc) {
    content += `<img src="${imgSrc}" style="max-width:200px;border-radius:6px;display:block;margin-bottom:8px;border:1px solid var(--border)"/>`;
  }

  if (text) {
    content += renderText(text, format);
  }

  let actions = '';
  if (role === 'ai' && text) {
    const ext = extFromFormat(format);
    actions = `
      <div class="msg-actions">
        <button class="act-btn" onclick="copyText(this, \`${escJS(text)}\`)">⧉ SALIN</button>
        <button class="act-btn" onclick="downloadText(\`${escJS(text)}\`, '${ext}')">⬇ DOWNLOAD .${ext.toUpperCase()}</button>
      </div>`;
  }

  div.innerHTML = `
    <div class="msg-label">${label}</div>
    <div class="msg-bubble">${content}</div>
    ${actions}`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function renderText(text, format) {
  // Render code blocks
  const escaped = text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  // Convert ```...``` to <pre><code>
  return escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code class="lang-${lang || 'text'}">${code.trim()}</code></pre>`;
  }).replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br/>');
}

function extFromFormat(fmt) {
  const map = { html:'html', php:'php', py:'py', js:'js', txt:'txt', md:'md' };
  return map[fmt] || 'txt';
}

function escJS(str) {
  return str.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
}

// ── TYPING ──
let typingCounter = 0;
function appendTyping() {
  const id = 'typing_' + (typingCounter++);
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ai typing-indicator';
  div.id = id;
  div.innerHTML = `
    <div class="msg-label">— RHF ZERO</div>
    <div class="msg-bubble">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return id;
}
function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── COPY / DOWNLOAD ──
async function copyText(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add('copied');
    btn.textContent = '✓ TERSALIN';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '⧉ SALIN'; }, 2000);
  } catch { toast('Gagal menyalin'); }
}

function downloadText(text, ext) {
  const blob = new Blob([text], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `rhf-zero-${Date.now()}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── SIDEBAR HISTORY (localStorage-based) ──
function loadSidebarHistory() {
  const hist = getHistory();
  const container = document.getElementById('sidebar-history');
  if (hist.length === 0) {
    container.innerHTML = '<div class="hist-empty">Belum ada riwayat.</div>';
    return;
  }

  // Show last 20 user messages as items
  const userLines = hist.filter(l => l.startsWith('user: ')).slice(-20).reverse();
  container.innerHTML = userLines.map((line, i) => {
    const text = line.replace('user: ', '').substring(0, 60);
    return `<div class="hist-item" onclick="loadHistoryItem(${hist.length - 1 - i})">${text}</div>`;
  }).join('');
}

function loadHistoryItem(idx) {
  // Just scroll to bottom and highlight — full reload omitted for simplicity
  closeSidebar();
  toast('Navigasi riwayat: gunakan chat aktif.');
}

// ── KEYBOARD ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// ── STATUS ──
function setStatus(msg) {
  document.getElementById('status-text').textContent = msg;
}

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── FOCUS INPUT ON LOAD ──
window.addEventListener('load', () => {
  document.getElementById('msg-input').focus();
});
</script>
