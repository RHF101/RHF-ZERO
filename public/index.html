<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHF ZERO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111118;
      border-bottom: 1px solid #1e1e2e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .title { font-size: 18px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 11px; color: #888; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00e676; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .status-text { font-size: 12px; color: #888; }
    .session-id {
      font-size: 11px; color: #555; background: #1a1a24;
      padding: 6px 12px; border-radius: 6px; max-width: 180px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-history {
      background: #1a1a28; color: #ccc; border: 1px solid #2a2a3a;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: 14px; transition: all 0.2s;
    }
    .btn-history:hover { background: #24243a; border-color: #6c5ce7; }
    .btn-logout {
      background: transparent; color: #ff6b6b; border: 1px solid #3a1a1a;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 11px; transition: all 0.2s;
    }
    .btn-logout:hover { background: #2a1a1a; }

    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 260px; background: #0e0e16;
      border-right: 1px solid #1e1e2e;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #1e1e2e; }
    .sidebar-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: #666; margin-bottom: 12px;
    }
    .btn-new-chat {
      width: 100%; padding: 10px; background: #1a1a28; color: #ccc;
      border: 1px solid #2a2a3a; border-radius: 8px; cursor: pointer;
      font-size: 13px; transition: all 0.2s;
    }
    .btn-new-chat:hover { background: #24243a; border-color: #6c5ce7; }
    .history-list { flex: 1; overflow-y: auto; padding: 8px; }
    .history-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      font-size: 12px; color: #999; margin-bottom: 4px;
      transition: all 0.15s; position: relative;
    }
    .history-item:hover { background: #1a1a28; color: #ccc; }
    .history-item.active { background: #1a1a2e; color: #a29bfe; border: 1px solid #2a2a4a; }
    .history-name { font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-preview { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-delete-chat {
      position: absolute; right: 8px; top: 8px;
      background: transparent; color: #555; border: none;
      cursor: pointer; font-size: 12px; padding: 2px 6px;
      border-radius: 4px; display: none;
    }
    .history-item:hover .btn-delete-chat { display: block; }
    .btn-delete-chat:hover { background: #2a1a1a; color: #ff6b6b; }

    .chat-container { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .avatar.user { background: #1e1e2e; }
    .avatar.ai { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
    .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; overflow-x: auto; }
    .bubble.user { background: #1a1a2e; color: #e0e0e0; border: 1px solid #2a2a4a; }
    .bubble.ai { background: #111118; color: #d0d0d0; border: 1px solid #1e1e2e; }
    .bubble pre { background: #0a0a14; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 12px; border: 1px solid #1e1e2e; position: relative; }
    .bubble code { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .code-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-copy, .btn-download { padding: 6px 14px; border: 1px solid #2a2a4a; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; background: #1a1a28; color: #ccc; display: inline-flex; align-items: center; gap: 4px; }
    .btn-copy:hover, .btn-download:hover { background: #24243a; border-color: #6c5ce7; color: #fff; }
    .btn-copy.copied, .btn-download.downloaded { background: #1a3a1a; border-color: #00e676; color: #00e676; }

    .input-container { padding: 16px 24px; border-top: 1px solid #1e1e2e; background: #0a0a0f; flex-shrink: 0; }
    .mode-selector { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .mode-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: #111118; color: #888; cursor: pointer; font-size: 11px; font-weight: 500; transition: all 0.2s; }
    .mode-btn:hover { background: #1a1a28; color: #ccc; }
    .mode-btn.active { background: #1a1a2e; color: #a29bfe; border-color: #6c5ce7; }
    .input-wrapper { display: flex; gap: 10px; align-items: flex-end; }
    .input-box { flex: 1; background: #111118; border: 1px solid #1e1e2e; border-radius: 12px; padding: 14px 18px; color: #e0e0e0; font-size: 14px; font-family: inherit; resize: none; min-height: 48px; max-height: 200px; outline: none; transition: border-color 0.2s; line-height: 1.5; }
    .input-box:focus { border-color: #6c5ce7; }
    .input-box::placeholder { color: #444; }
    .btn-send { background: linear-gradient(135deg, #6c5ce7, #8b7cf0); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; flex-shrink: 0; }
    .btn-send:hover { background: linear-gradient(135deg, #7d6ff0, #9b8ff5); transform: translateY(-1px); }
    .btn-send:disabled { background: #1e1e2e; color: #555; cursor: not-allowed; transform: none; }
    .btn-upload { background: #111118; color: #888; border: 1px solid #1e1e2e; padding: 12px 16px; border-radius: 12px; cursor: pointer; font-size: 14px; transition: all 0.2s; flex-shrink: 0; }
    .btn-upload:hover { background: #1a1a28; color: #ccc; }

    .loading-dots { display: flex; gap: 4px; padding: 8px 0; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: #555; animation: bounce 1.4s infinite ease-in-out; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0.6);} 40%{transform:scale(1);} }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2a3a; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message { max-width: 95%; }
      .header { padding: 10px 16px; }
      .chat-messages { padding: 16px; }
      .input-container { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">⚡</div>
    <div>
      <div class="title">RHF ZERO</div>
      <div class="subtitle">Asisten Cerdas</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-text">Online</span>
    <span class="session-id" id="sessionId">User: ...</span>
    <button class="btn-history" onclick="toggleHistory()" title="Riwayat">⚙️</button>
    <button class="btn-logout" onclick="logout()">🚪 Keluar</button>
  </div>
</header>

<main class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Riwayat Chat</div>
      <button class="btn-new-chat" onclick="chatBaru()">+ Chat Baru</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="avatar ai">🧠</div>
        <div>
          <div class="bubble ai">
            Halo! Aku RHF ZERO, asisten serba bisa.<br><br>
            <b>💬 Santai:</b> Ngobrol biasa<br>
            <b>⚡ Serius:</b> Coding & teknis<br>
            <b>🔍 Detektif:</b> Investigasi & analisis<br>
            <b>🌐 Scraper:</b> Cari & gabung web<br><br>
            Pilih mode di bawah ya 🚀
          </div>
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('santai')" id="btnSantai">💬 Santai</button>
        <button class="mode-btn" onclick="setMode('serius')" id="btnSerius">⚡ Serius</button>
        <button class="mode-btn" onclick="setMode('detektif')" id="btnDetektif">🔍 Detektif</button>
        <button class="mode-btn" onclick="setMode('scraper')" id="btnScraper">🌐 Scraper</button>
      </div>
      <div class="input-wrapper">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()" title="Upload">📎</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleFileUpload(event)" accept="*/*">
        <textarea class="input-box" id="userInput" placeholder="Ketik pesan..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button class="btn-send" id="btnSend" onclick="sendMessage()">Kirim</button>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ============================================================
// FIREBASE INIT
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDNFXLa8WGAqhLnc8RrLLTgP3nLWvXkd1w",
  authDomain: "rhf-confrims.firebaseapp.com",
  projectId: "rhf-confrims",
  storageBucket: "rhf-confrims.firebasestorage.app",
  messagingSenderId: "631231605918",
  appId: "1:631231605918:web:5a7eeeb61beeae91d65f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ============================================================
// CEK LOGIN
// ============================================================
let UID = localStorage.getItem('rhf_uid') || null;

// Ambil UID dari localStorage dulu (instant)
const savedUser = localStorage.getItem('rhf_user');
if (savedUser) {
  try {
    const userData = JSON.parse(savedUser);
    if (userData.uid) {
      UID = userData.uid;
      document.getElementById('sessionId').textContent = userData.name || userData.email || 'User';
    }
  } catch(e) {}
}

// Firebase Auth (background check)
auth.onAuthStateChanged(async (user) => {
  if (user) {
    UID = user.uid;
    localStorage.setItem('rhf_uid', user.uid);
    localStorage.setItem('rhf_user', JSON.stringify({
      uid: user.uid,
      name: user.displayName,
      email: user.email,
      photo: user.photoURL
    }));
    document.getElementById('sessionId').textContent = user.displayName || user.email || 'User';
    loadUserHistory();
  } else if (!UID) {
    window.location.href = '/login.html';
  }
});

function logout() {
  auth.signOut().then(() => {
    localStorage.removeItem('rhf_user');
    localStorage.removeItem('rhf_uid');
    window.location.href = '/login.html';
  });
}
  
const API_URL = '/api/chat';
const MEMORY_URL = '/api/memory';
const DOWNLOAD_URL = '/api/download';

let isProcessing = false;
let currentMode = 'santai';
let lastRawCode = null;
let lastFilename = 'kode.txt';
let currentChatId = null;
let chatList = [];

// ============================================================
// HISTORY
// ============================================================
function toggleHistory() {
  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
}

async function loadUserHistory() {
  if (!UID) return;
  try {
    const res = await fetch(MEMORY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getChats', uid: UID })
    });
    const data = await res.json();
    if (data.success && data.rooms && data.rooms.length > 0) {
      chatList = data.rooms;
      renderHistoryList();
      bukaChat(chatList[0].chatId);
    } else {
      chatBaru();
    }
  } catch(e) {
    chatBaru();
  }
}

function renderHistoryList() {
  const list = document.getElementById('historyList');
  list.innerHTML = chatList.map(c => `
    <div class="history-item${c.chatId === currentChatId ? ' active' : ''}" onclick="bukaChat('${c.chatId}')">
      <div class="history-name">${escapeHTML(c.nama || 'Chat Baru')}</div>
      <div class="history-preview">${escapeHTML(c.pesanTerakhir || 'Kosong')}</div>
      <button class="btn-delete-chat" onclick="event.stopPropagation();hapusChat('${c.chatId}')">🗑️</button>
    </div>`).join('');
}

async function chatBaru() {
  if (!UID) return;
  try {
    const res = await fetch(MEMORY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'createChat', uid: UID, data: { nama: 'Chat Baru' } })
    });
    const data = await res.json();
    if (data.success) {
      currentChatId = data.chatId;
      await loadUserHistory();
      bersihkanChat();
    }
  } catch(e) {
    currentChatId = 'local_' + Date.now();
    bersihkanChat();
  }
}

async function bukaChat(chatId) {
  currentChatId = chatId;
  bersihkanChat();
  if (!UID) return;
  try {
    const res = await fetch(MEMORY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getMessages', uid: UID, chatId, data: { limit: 100 } })
    });
    const data = await res.json();
    if (data.success && data.messages.length > 0) {
      document.getElementById('chatMessages').innerHTML = '';
      data.messages.forEach(msg => {
        if (msg.role === 'user') addMessage('user', msg.content, null, false);
        else {
          const rawCode = extractCode(msg.content);
          addMessage('ai', formatCode(msg.content, rawCode), rawCode, !!rawCode);
        }
      });
    }
    renderHistoryList();
  } catch(e) {}
}

async function hapusChat(chatId) {
  if (!confirm('Hapus chat ini?')) return;
  try {
    await fetch(MEMORY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteChat', uid: UID, chatId })
    });
    loadUserHistory();
  } catch(e) {}
}

function bersihkanChat() {
  document.getElementById('chatMessages').innerHTML = `
    <div class="message ai">
      <div class="avatar ai">🧠</div>
      <div>
        <div class="bubble ai">
          Halo! Aku RHF ZERO, asisten serba bisa.<br><br>
          <b>💬 Santai:</b> Ngobrol biasa<br>
          <b>⚡ Serius:</b> Coding & teknis<br>
          <b>🔍 Detektif:</b> Investigasi & analisis<br>
          <b>🌐 Scraper:</b> Cari & gabung web<br><br>
          Pilih mode di bawah ya 🚀
        </div>
      </div>
    </div>`;
}

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// MODE
// ============================================================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1));
  if (btn) btn.classList.add('active');
}

// ============================================================
// SEND MESSAGE
// ============================================================
function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  if (isProcessing) return;
  if (!UID) {
    addMessage('ai', '⏳ Menghubungkan... Coba lagi sebentar.', null, false);
    return;
  }
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message) return;

  isProcessing = true;
  document.getElementById('btnSend').disabled = true;
  addMessage('user', message);
  input.value = '';
  const loadingId = addLoading();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        mode: currentMode,
        uid: UID,
        chatId: currentChatId,
        history: JSON.parse(localStorage.getItem('rhf_history') || '[]'),
        facts: JSON.parse(localStorage.getItem('rhf_facts') || '[]')
      })
    });
    const data = await res.json();
    removeLoading(loadingId);

    const rawCode = extractCode(data.response) || data.response;
    if (data.mode === 'serius' || data.mode === 'scraper') {
      lastRawCode = rawCode;
      addMessage('ai', formatCode(data.response, rawCode), rawCode, true);
    } else {
      addMessage('ai', data.response, null, false);
    }

    // Simpan ke localStorage
    if (data.simpan) {
      let history = JSON.parse(localStorage.getItem('rhf_history') || '[]');
      let facts = JSON.parse(localStorage.getItem('rhf_facts') || '[]');
      history.push('👤: ' + data.simpan.userMsg);
      history.push('🤖: ' + data.simpan.aiMsg);
      if (history.length > 300) history = history.slice(-300);
      if (data.simpan.isFakta) {
        facts.push(message);
        if (facts.length > 30) facts = facts.slice(-30);
      }
      localStorage.setItem('rhf_history', JSON.stringify(history));
      localStorage.setItem('rhf_facts', JSON.stringify(facts));
    }

    // Update history list tanpa refresh chat
    if (currentChatId) {
      try {
        const hRes = await fetch(MEMORY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'getChats', uid: UID })
        });
        const hData = await hRes.json();
        if (hData.success) {
          chatList = hData.rooms;
          renderHistoryList();
        }
      } catch(e) {}
    }
  } catch (e) {
    removeLoading(loadingId);
    addMessage('ai', '❌ ' + e.message, null, false);
  }
  isProcessing = false;
  document.getElementById('btnSend').disabled = false;
  document.getElementById('userInput').focus();
}

// ============================================================
// HELPERS
// ============================================================
function addMessage(role, content, rawCode, showActions) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const av = role === 'user' ? '👤' : '🧠';
  let actions = '';
  if (showActions && rawCode) {
    actions = `<div class="code-actions">
      <button class="btn-copy" onclick="copyCode(this)" data-code="${encodeURIComponent(rawCode)}">📋 Salin</button>
      <button class="btn-download" onclick="downloadCode(this)" data-code="${encodeURIComponent(rawCode)}">📥 Download</button>
    </div>`;
  }
  div.innerHTML = `<div class="avatar ${role}">${av}</div><div><div class="bubble ${role}">${content}</div>${actions}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addLoading() {
  const msgs = document.getElementById('chatMessages');
  const id = 'load_' + Date.now();
  const div = document.createElement('div');
  div.id = id;
  div.className = 'message ai';
  div.innerHTML = '<div class="avatar ai">🧠</div><div><div class="bubble ai"><div class="loading-dots"><span></span><span></span><span></span></div></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeLoading(id) { const el = document.getElementById(id); if (el) el.remove(); }

function extractCode(text) {
  if (!text) return null;
  const m = text.match(/```[\w]*\n([\s\S]*?)```/);
  return m ? m[1].trim() : null;
}

function formatCode(text, code) {
  if (!code) return text;
  const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return text.replace(/```[\w]*\n[\s\S]*?```/, `<pre><code>${esc}</code></pre>`);
}

async function copyCode(btn) {
  const code = decodeURIComponent(btn.getAttribute('data-code'));
  try { await navigator.clipboard.writeText(code); } catch(e) {
    const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }
  btn.textContent = '✅'; setTimeout(() => btn.textContent = '📋 Salin', 1500);
}

async function downloadCode(btn) {
  const code = decodeURIComponent(btn.getAttribute('data-code'));
  const format = btn.getAttribute('data-format') || 'txt';
  
  // Ambil kata kunci dari pesan user terakhir
  let keyword = 'kode';
  const lastUserMsg = document.querySelector('.message.user:last-child .bubble');
  if (lastUserMsg) {
    const text = lastUserMsg.textContent || '';
    const cleanText = text.replace(/buatkan|buat|bikinin|tolong|coding|file|html|css|js|python|php/gi, '');
    keyword = cleanText.trim().substring(0, 20).replace(/[^a-zA-Z0-9]/g, '_') || 'kode';
  }

  const filename = keyword + '.' + format;
  const mimeTypes = { html: 'text/html', js: 'text/javascript', py: 'text/x-python', php: 'text/php', css: 'text/css', txt: 'text/plain' };
  const blob = new Blob([code], { type: mimeTypes[format] || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  
  btn.textContent = '✅'; 
  setTimeout(() => btn.textContent = '📥 Download', 1500);
}
function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('userInput').value = `[File: ${file.name}]\n${reader.result.substring(0,500)}`;
  };
  reader.readAsText(file);
}
</script>
</body>
