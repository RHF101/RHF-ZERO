<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHF ZERO — Akses</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b10;
      color: #d0dce8;
      font-family: 'Orbitron', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
    }
    .box {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #c9a84c, #4db8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p { color: #5a7a96; font-size: 12px; margin-bottom: 24px; letter-spacing: .2em; }
    input {
      background: #111820;
      border: 1px solid #1e2d3d;
      color: #d0dce8;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      letter-spacing: .2em;
      border-radius: 8px;
      width: 200px;
      font-family: 'JetBrains Mono', monospace;
    }
    button {
      margin-top: 12px;
      padding: 12px 24px;
      background: #c9a84c;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #ff3860;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>RHF ZERO</h1>
  <p>MASUKKAN KODE AKSES</p>
  <input id="codeInput" type="text" placeholder="XXXX-XXXX" autocomplete="off">
  <br>
  <button onclick="verifyCode()">🔑 VERIFIKASI</button>
  <div id="status"></div>
</div>

<script>
  // Cek kalau sudah pernah verifikasi
  if (localStorage.getItem('rhf_access_valid') === 'true') {
    window.location.href = '/';
  }

  async function verifyCode() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return;
    
    document.getElementById('status').textContent = 'Memeriksa...';
    
    try {
      const res = await fetch('/api/access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await res.json();
      
      if (data.valid) {
        localStorage.setItem('rhf_access_valid', 'true');
        localStorage.setItem('rhf_access_code', code);
        window.location.href = '/';
      } else {
        document.getElementById('status').textContent = '❌ ' + (data.error || 'Kode tidak valid');
      }
    } catch(e) {
      document.getElementById('status').textContent = '❌ Gagal terhubung';
    }
  }
</script>
</body>
  </html>
